repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(\.venv|docs|_build)/

  - repo: https://github.com/TheTrueSCU/hexaqual
    rev: v0.9.6
    hooks:
      - id: hexaqual-sanity
        args: [--skip-diagrams]
      - id: hexaqual-architecture
      - id: hexaqual-agents
      - id: hexaqual-commit-msg
        stages: [commit-msg]
      - id: hexaqual-pre-push
        args: [--skip-diagrams]
        stages: [pre-push]
      - id: hexaqual-agents-sync
        stages: [post-merge, post-checkout]

  - repo: local
    hooks:
      - id: hexaqual-pre-push-tests
        name: hexaqual pre-push affected unit tests
        entry: uv run hexaqual test run -A -U -n auto
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
