name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  quality-gate:
    name: Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/ci.yml --summary --critical-path

      - name: Run Quality Gate via Hexaqual
        uses: TheTrueSCU/hexaqual@7de5ade62e96ac7623b5ec649997e562eea2822d # v0.9.3
        with:
          skip-hooks: hexaqual-agents
          sync-args: "--all-groups"

      - name: Audit Repository Quality Gates
        run: uv run hexaqual sanity --audit-gates

      - name: Verify Documentation Consistency (Anti-Drift Linter)
        run: uv run hexaqual docs drift

  test-suite:
    name: Unit & Architecture Tests (Python ${{ matrix.python-version }})
    needs: [quality-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Test Suite
        run: uv run pytest
